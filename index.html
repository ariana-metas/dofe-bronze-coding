<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DofE Skills Avatar Creator & Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .bounce-anim { transition: transform 0.15s cubic-bezier(0.34, 1.56, 0.64, 1); }
        .bounce-anim:active { transform: scale(0.92) rotate(-3deg); }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col items-center justify-center p-4 selection:bg-blue-500 selection:text-white">

    <div class="w-full max-w-4xl bg-slate-800/80 backdrop-blur-xl border border-slate-700/60 rounded-3xl shadow-2xl overflow-hidden grid grid-cols-1 md:grid-cols-12 gap-0">
        
        <!-- Left Panel: Avatar Canvas & Dialogue -->
        <div class="md:col-span-5 p-6 md:p-8 flex flex-col items-center justify-between border-b md:border-b-0 md:border-r border-slate-700/60 bg-slate-900/40">
            <div class="w-full flex justify-between items-center mb-4">
                <span class="text-xs font-bold tracking-wider text-blue-400 uppercase bg-blue-500/10 px-3 py-1 rounded-full border border-blue-500/20">DofE Level 1</span>
                <span id="live-status" class="text-xs text-emerald-400 flex items-center gap-1.5"><span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>Ready</span>
            </div>

            <!-- Avatar Display Card -->
            <div id="avatar-click-area" class="bounce-anim cursor-pointer relative group my-2 w-48 h-48 rounded-2xl bg-gradient-to-b from-slate-800 to-slate-900 border border-slate-700/80 shadow-inner flex items-center justify-center overflow-hidden">
                <div class="absolute inset-0 opacity-15 bg-[radial-gradient(#3b82f6_1px,transparent_1px)] [background-size:12px_12px]"></div>
                
                <!-- SVG Avatar -->
                <svg id="avatar-svg" viewBox="0 0 200 200" class="w-40 h-40 drop-shadow-md z-10">
                    <circle cx="100" cy="100" r="90" fill="#e0f2fe" id="bg-circle" />
                    <!-- Body -->
                    <path d="M50 170 C50 130, 70 120, 100 120 C130 120, 150 130, 150 170 Z" fill="#0284c7" id="avatar-body" />
                    <!-- Head -->
                    <circle cx="100" cy="85" r="35" fill="#fcd34d" id="avatar-head" />
                    <!-- Eyes -->
                    <circle cx="88" cy="80" r="4" fill="#1e293b" id="left-eye" />
                    <circle cx="112" cy="80" r="4" fill="#1e293b" id="right-eye" />
                    <!-- Mouth -->
                    <path d="M 90 95 Q 100 105 110 95" stroke="#1e293b" stroke-width="3" fill="none" id="avatar-mouth" />
                    <!-- Accessory / Skill Element -->
                    <g id="accessory" transform="translate(0,0)">
                        <rect x="80" y="72" width="18" height="10" rx="2" fill="none" stroke="#0f172a" stroke-width="2"/>
                        <rect x="102" y="72" width="18" height="10" rx="2" fill="none" stroke="#0f172a" stroke-width="2"/>
                        <line x1="98" y1="77" x2="102" y2="77" stroke="#0f172a" stroke-width="2"/>
                    </g>
                </svg>
                <div class="absolute inset-0 bg-black/40 opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center text-xs font-semibold text-white tracking-wide">
                    Click to Interact!
                </div>
            </div>

            <!-- Speech/Dialogue Bubble -->
            <div class="w-full mt-4 bg-slate-800/90 border border-slate-700/80 rounded-xl p-3.5 text-xs text-slate-300 text-center min-h-[56px] flex items-center justify-center relative shadow-sm">
                <span id="dialogue-text">Welcome! Click your avatar or log hours to track progress.</span>
            </div>

            <!-- Quick Export Button -->
            <button onclick="exportAvatar()" class="w-full mt-4 bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 text-xs font-semibold py-2.5 rounded-xl transition-all flex items-center justify-center gap-2">
                📥 Export Avatar SVG
            </button>
        </div>

        <!-- Right Panel: Customization & Hours Log -->
        <div class="md:col-span-7 p-6 md:p-8 flex flex-col justify-between">
            <div>
                <div class="flex border-b border-slate-700/80 mb-6">
                    <button onclick="switchTab('customizer')" id="tab-btn-customizer" class="pb-3 px-4 text-xs font-bold border-b-2 border-blue-500 text-blue-400 transition-all">🎨 Avatar Customizer</button>
                    <button onclick="switchTab('tracker')" id="tab-btn-tracker" class="pb-3 px-4 text-xs font-bold border-b-2 border-transparent text-slate-400 hover:text-slate-200 transition-all">⏱️ Skills Hours Log</button>
                </div>

                <!-- Customizer View -->
                <div id="view-customizer" class="space-y-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-400 mb-1.5">DofE Skill Focus Theme</label>
                        <select id="skill-theme-select" onchange="changeSkillTheme(this.value)" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3.5 py-2.5 text-xs text-slate-200 focus:outline-none focus:border-blue-500">
                            <option value="coding">💻 Coding & Technology</option>
                            <option value="music">🎵 Music & Performance</option>
                            <option value="fitness">⚡ Physical & Sports</option>
                            <option value="design">🎨 Design & Creative Arts</option>
                        </select>
                    </div>

                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-xs font-semibold text-slate-400 mb-1.5">Outfit Color</label>
                            <input type="color" id="outfit-color" value="#0284c7" oninput="document.getElementById('avatar-body').setAttribute('fill', this.value)" class="w-full h-10 bg-slate-900 border border-slate-700 rounded-xl cursor-pointer p-1">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-400 mb-1.5">Background Theme</label>
                            <input type="color" id="bg-color" value="#e0f2fe" oninput="document.getElementById('bg-circle').setAttribute('fill', this.value)" class="w-full h-10 bg-slate-900 border border-slate-700 rounded-xl cursor-pointer p-1">
                        </div>
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-slate-400 mb-1.5">Expression State</label>
                        <div class="grid grid-cols-3 gap-2">
                            <button onclick="setExpression('smile')" class="bg-slate-900 hover:bg-slate-700/80 border border-slate-700 text-xs font-medium py-2 rounded-xl transition-all">😊 Smile</button>
                            <button onclick="setExpression('laugh')" class="bg-slate-900 hover:bg-slate-700/80 border border-slate-700 text-xs font-medium py-2 rounded-xl transition-all">😆 Laugh</button>
                            <button onclick="setExpression('wink')" class="bg-slate-900 hover:bg-slate-700/80 border border-slate-700 text-xs font-medium py-2 rounded-xl transition-all">😉 Wink</button>
                        </div>
                    </div>

                    <button onclick="randomizeAvatar()" class="w-full mt-2 bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white font-semibold text-xs py-3 rounded-xl transition-all shadow-lg shadow-blue-500/20">
                        🎲 Generate Random Setup
                    </button>
                </div>

                <!-- Tracker View -->
                <div id="view-tracker" class="hidden space-y-4">
                    <div class="bg-slate-900/60 border border-slate-700/80 rounded-2xl p-4">
                        <div class="flex justify-between items-center mb-2">
                            <span class="text-xs font-semibold text-slate-400">Total Logged Hours</span>
                            <span class="text-xs font-bold text-blue-400"><span id="logged-hours">0</span> / 12 Hours</span>
                        </div>
                        <div class="w-full bg-slate-800 h-2.5 rounded-full overflow-hidden border border-slate-700/60">
                            <div id="progress-bar" class="bg-gradient-to-r from-blue-500 to-indigo-500 h-full w-[0%] transition-all duration-500"></div>
                        </div>
                    </div>

                    <div class="grid grid-cols-3 gap-2">
                        <input type="date" id="log-date" class="bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-xs text-slate-200 focus:outline-none focus:border-blue-500">
                        <input type="number" id="log-amount" placeholder="Hours (e.g. 1)" min="0.5" max="5" step="0.5" class="bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-xs text-slate-200 focus:outline-none focus:border-blue-500">
                        <button onclick="addHours()" class="bg-blue-600 hover:bg-blue-500 text-white font-semibold text-xs rounded-xl transition-all shadow-md">Add Log</button>
                    </div>

                    <div class="max-h-36 overflow-y-auto space-y-2 pr-1 custom-scroll" id="log-history">
                        <p class="text-xs text-slate-500 text-center py-4">No hours logged yet for this week.</p>
                    </div>
                </div>
            </div>

            <div class="mt-6 pt-4 border-t border-slate-700/60 text-center">
                <p class="text-[11px] text-slate-500">Built for Duke of Edinburgh Skills Section Verification.</p>
            </div>
        </div>

    </div>

    <script>
        // State
        let totalHours = 0;
        let logs = [];

        // Tab Switching
        function switchTab(tab) {
            const customizer = document.getElementById('view-customizer');
            const tracker = document.getElementById('view-tracker');
            const btnC = document.getElementById('tab-btn-customizer');
            const btnT = document.getElementById('tab-btn-tracker');

            if (tab === 'customizer') {
                customizer.classList.remove('hidden');
                tracker.classList.add('hidden');
                btnC.className = "pb-3 px-4 text-xs font-bold border-b-2 border-blue-500 text-blue-400 transition-all";
                btnT.className = "pb-3 px-4 text-xs font-bold border-b-2 border-transparent text-slate-400 hover:text-slate-200 transition-all";
            } else {
                tracker.classList.remove('hidden');
                customizer.classList.add('hidden');
                btnT.className = "pb-3 px-4 text-xs font-bold border-b-2 border-blue-500 text-blue-400 transition-all";
                btnC.className = "pb-3 px-4 text-xs font-bold border-b-2 border-transparent text-slate-400 hover:text-slate-200 transition-all";
            }
        }

        // Avatar Interactivity & Quotes
        const quotes = [
            "Consistency is key! Keep tracking those skill hours.",
            "Awesome work building your DofE portfolio!",
            "Every hour spent learning brings you closer to your goal.",
            "Looking sharp! Don't forget to write your assessor notes."
        ];

        document.getElementById('avatar-click-area').addEventListener('click', () => {
            const randomQuote = quotes[Math.floor(Math.random() * quotes.length)];
            document.getElementById('dialogue-text').textContent = randomQuote;
        });

        // Theme Customizer Logic
        const themes = {
            coding: { color: '#0284c7', bg: '#e0f2fe', acc: '<rect x="80" y="72" width="18" height="10" rx="2" fill="none" stroke="#0f172a" stroke-width="2"/><rect x="102" y="72" width="18" height="10" rx="2" fill="none" stroke="#0f172a" stroke-width="2"/><line x1="98" y1="77" x2="102" y2="77" stroke="#0f172a" stroke-width="2"/>' },
            music: { color: '#9333ea', bg: '#f3e8ff', acc: '<path d="M 95 65 L 95 80 M 95 65 Q 105 60 105 75 L 105 80" stroke="#1e293b" stroke-width="3" fill="none"/><circle cx="92" cy="80" r="4" fill="#1e293b"/><circle cx="108" cy="80" r="4" fill="#1e293b"/>' },
            fitness: { color: '#16a34a', bg: '#dcfce7', acc: '<path d="M 67 70 Q 100 55 133 70" stroke="#ef4444" stroke-width="6" fill="none"/>' },
            design: { color: '#db2777', bg: '#fce7f3', acc: '<path d="M 65 75 Q 100 40 145 75 Z" fill="#db2777"/>' }
        };

        function changeSkillTheme(key) {
            const t = themes[key];
            document.getElementById('outfit-color').value = t.color;
            document.getElementById('bg-color').value = t.bg;
            document.getElementById('avatar-body').setAttribute('fill', t.color);
            document.getElementById('bg-circle').setAttribute('fill', t.bg);
            document.getElementById('accessory').innerHTML = t.acc;
            document.getElementById('dialogue-text').textContent = `Switched focus to ${key} skill module!`;
        }

        function setExpression(type) {
            const mouth = document.getElementById('avatar-mouth');
            const leftEye = document.getElementById('left-eye');
            
            leftEye.setAttribute('r', '4'); // reset wink
            if (type === 'smile') {
                mouth.setAttribute('d', 'M 90 95 Q 100 105 110 95');
                document.getElementById('dialogue-text').textContent = "Ready to conquer today's skill session!";
            } else if (type === 'laugh') {
                mouth.setAttribute('d', 'M 85 92 Q 100 115 115 92');
                document.getElementById('dialogue-text').textContent = "Having fun mastering new techniques!";
            } else if (type === 'wink') {
                mouth.setAttribute('d', 'M 90 98 Q 100 105 110 98');
                leftEye.setAttribute('r', '1.5'); // wink line/dot representation
                document.getElementById('dialogue-text').textContent = "Secret skills progress unlocked!";
            }
        }

        function randomizeAvatar() {
            const keys = Object.keys(themes);
            const randomKey = keys[Math.floor(Math.random() * keys.length)];
            document.getElementById('skill-theme-select').value = randomKey;
            changeSkillTheme(randomKey);

            const randomColor = '#' + Math.floor(Math.random()*16777215).toString(16).padStart(6, '0');
            document.getElementById('outfit-color').value = randomColor;
            document.getElementById('avatar-body').setAttribute('fill', randomColor);
            document.getElementById('dialogue-text').textContent = "Generated random avatar profile!";
        }

        // Hours Tracker Logic
        function addHours() {
            const dateInput = document.getElementById('log-date').value;
            const amountInput = parseFloat(document.getElementById('log-amount').value);

            if (!dateInput || !amountInput || isNaN(amountInput)) {
                alert('Please enter a valid date and number of hours.');
                return;
            }

            totalHours += amountInput;
            logs.push({ date: dateInput, hours: amountInput });

            // Update UI
            document.getElementById('logged-hours').textContent = totalHours;
            const percentage = Math.min((totalHours / 12) * 100, 100);
            document.getElementById('progress-bar').style.width = percentage + '%';

            renderLogs();
            document.getElementById('log-amount').value = '';
            document.getElementById('dialogue-text').textContent = `Logged ${amountInput} hours successfully! Keep it up.`;
        }

        function renderLogs() {
            const container = document.getElementById('log-history');
            if (logs.length === 0) {
                container.innerHTML = `<p class="text-xs text-slate-500 text-center py-4">No hours logged yet for this week.</p>`;
                return;
            }

            container.innerHTML = logs.map(l => `
                <div class="bg-slate-900/80 border border-slate-700/60 rounded-xl p-2.5 flex justify-between items-center text-xs">
                    <span class="text-slate-300">📅 ${l.date}</span>
                    <span class="font-bold text-blue-400">+${l.hours} hrs</span>
                </div>
            `).join('');
        }

        // Export SVG Feature
        function exportAvatar() {
            const svgData = document.getElementById('avatar-svg').outerHTML;
            const blob = new Blob([svgData], {type: 'image/svg+xml'});
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'dofe-skill-avatar.svg';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            document.getElementById('dialogue-text').textContent = "Avatar SVG exported for your DofE evidence portfolio!";
        }

        // Set default date to today
        document.getElementById('log-date').valueAsDate = new Date();
    </script>
</body>
</html>
